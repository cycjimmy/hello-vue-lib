name: Bug report
description: Create a report to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so the issue can be triaged quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The version of this library (or of your derived package) you are using.
      placeholder: 2.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js/npm versions, the bundler and its version, the OS, and the browser if the problem is UI related.
      value: |
        Node.js:
        npm:
        Bundler (Vite/webpack/...):
        OS:
        Browser (only if UI related):
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior, or a minimal demo (repository / code sandbox) that shows the problem. A missing `@cycjimmy/hello-vue-lib/style.css` import is a common cause of unstyled output, so please mention where the style sheet is imported.
      placeholder: |
        1. Import the component and the style sheet
        2. Render it with ...
        3. See error
      render: text
    validations:
      required: true

  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: The bundler configuration (for example `vite.config.ts`) or a link to the repository that shows the problem.
      render: text

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The build output or console error around the failure, if available.
      render: shell

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
